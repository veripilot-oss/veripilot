name: Linux (Ubuntu 22.04)

on:
  push:
    branches: [main]
  pull_request:

env:
  VERILATOR_TAG: v5.034
  VERILATOR_VERSION: "5.034"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          else
            python -m pip install pytest pyyaml
          fi

      - name: Cache Verilator
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/verilator
          key: verilator-${{ runner.os }}-${{ env.VERILATOR_TAG }}

      - name: Build Verilator ${{ env.VERILATOR_TAG }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ make flex bison help2man perl python3 libfl2 libfl-dev zlib1g-dev ccache
          git clone --depth 1 --branch "$VERILATOR_TAG" https://github.com/verilator/verilator /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install

      - name: Add Verilator to PATH
        run: |
          sudo apt-get install -y g++ make ccache
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/verilator/share/verilator" >> "$GITHUB_ENV"

      - name: Check Verilator version
        run: |
          verilator --version
          verilator --version | grep -q "Verilator $VERILATOR_VERSION "

      - name: Lint golden examples
        run: |
          for rtl in examples/*/golden/*.v; do
            echo "==> Linting golden design: $rtl"
            verilator --lint-only -Wall "$rtl"
          done

      - name: Run regression runner on golden examples
        run: |
          for design in fifo spi timer; do
            echo "==> Running regression on $design"
            PYTHONPATH=. python3 -m regress.runner "$design" --seeds 1 2
          done

      - name: Run triage runner on flaky and failing examples
        run: |
          echo "==> Running triage on the flaky and repeatable demos"
          PYTHONPATH=. python3 -m triage.runner fifo --test tb_fifo_flaky --seeds 1 2 3 4 5
          PYTHONPATH=. python3 -m triage.runner fifo --test tb_fifo_repeatable --seeds 1 2 3 4 5

      - name: Run linter on buggy examples
        run: |
          PYTHONPATH=. python3 lint/linter.py examples results/lint.json

      - name: Run autofix on buggy examples
        run: |
          PYTHONPATH=. python3 -m autofix --examples examples --results results/results.json

      - name: Run coverage advisor on examples
        run: |
          PYTHONPATH=. python3 coverage_advisor/advisor.py fifo spi timer

      - name: Validate generated results.json schema
        run: |
          PYTHONPATH=. python3 -c "
          import json, sys
          from tests.test_results_schema import validate
          with open('results/results.json', 'r', encoding='utf-8') as f:
              doc = json.load(f)
          errs = validate(doc)
          if errs:
              print('Validation errors in results/results.json:', errs, file=sys.stderr)
              sys.exit(1)
          print('results/results.json is valid')
          "

      - name: Run Python unit tests
        run: |
          PYTHONPATH=. python -m pytest
