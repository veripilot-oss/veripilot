name: Windows

on:
  push:
    branches: [main]
  pull_request:

env:
  VERILATOR_TAG: v5.034
  VERILATOR_VERSION: "5.034"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            make
            autoconf
            automake
            flex
            bison
            help2man
            perl
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python

      - name: Cache Verilator
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.msys2.outputs.msys2-location }}\opt\verilator
          key: verilator-${{ runner.os }}-${{ env.VERILATOR_TAG }}

      - name: Build Verilator ${{ env.VERILATOR_TAG }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch "$VERILATOR_TAG" https://github.com/verilator/verilator /tmp/verilator
          cd /tmp/verilator
          # flex installs FlexLexer.h under /usr/include, which the UCRT64 gcc does not search
          cp /usr/include/FlexLexer.h src/
          cp /usr/include/FlexLexer.h /ucrt64/include/
          # stop MSYS2 from rewriting the -DDEFENV_* path defines
          export MSYS2_ARG_CONV_EXCL="-DDEFENV"
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          make install

      - name: Lay out the Verilator kit where the Windows binary looks for it
        shell: msys2 {0}
        run: |
          # verilator_bin.exe takes <prefix> as its root, but make install puts
          # include/ and the helper scripts under <prefix>/share/verilator.
          # Do not set VERILATOR_ROOT, Verilator rejects it as inconsistent.
          [ -d /opt/verilator/include ] || cp -r /opt/verilator/share/verilator/include /opt/verilator/include
          cp -n /opt/verilator/share/verilator/bin/* /opt/verilator/bin/

      - name: Check Verilator version
        shell: msys2 {0}
        run: |
          export PATH=/opt/verilator/bin:$PATH
          verilator --version
          verilator --version | grep -q "Verilator $VERILATOR_VERSION "

      - name: Smoke test lint and simulation
        shell: msys2 {0}
        run: |
          # native UCRT64 python3 must come first: the MSYS python cannot open
          # the C:/ paths in Verilator's generated makefiles
          export PATH=/ucrt64/bin:/opt/verilator/bin:$PATH
          mkdir smoke && cd smoke
          cat > dut.v <<'EOF'
          module dut(input clk, input rst, output reg [3:0] q);
            always @(posedge clk) if (rst) q <= 4'd0; else q <= q + 4'd1;
          endmodule
          EOF
          cat > tb.v <<'EOF'
          module tb;
            reg clk = 0, rst = 1; wire [3:0] q;
            dut d(.clk(clk), .rst(rst), .q(q));
            always #5 clk = ~clk;
            initial begin
              #12 rst = 0;
              #40 if (q == 4'd4) $display("PASS"); else $display("FAIL");
              $finish;
            end
          endmodule
          EOF
          verilator --lint-only -Wall dut.v
          # -std=gnu++17 avoids undefined std::string symbols with GCC 16 on UCRT64
          # TODO: switch to examples/fifo/golden/fifo.v and tb_fifo.v after PR #2 merges
          verilator --binary --timing -Wall -Wno-fatal -CFLAGS -std=gnu++17 --top-module tb dut.v tb.v
          ./obj_dir/Vtb | tee out.txt
          grep -q PASS out.txt

      - name: Install package and run tests
        shell: msys2 {0}
        run: |
          export PATH=/opt/verilator/bin:$PATH
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
            python -m pytest
          else
            echo "No pyproject.toml yet, skipping Python tests"
          fi

      - name: Run coverage advisor (fifo, spi, timer)
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:/opt/verilator/bin:$PATH
          python coverage_advisor/advisor.py fifo spi timer

      - name: Validate generated results.json
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:/opt/verilator/bin:$PATH
          python -c "
          import json, sys
          from tests.test_results_schema import validate
          with open('results/results.json', 'r', encoding='utf-8') as f:
              doc = json.load(f)
          errs = validate(doc)
          if errs:
              print('Validation errors in results/results.json:', errs, file=sys.stderr)
              sys.exit(1)
          print('results/results.json is valid')
          "
